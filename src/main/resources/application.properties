spring.application.name=inventory

spring.config.import=optional:file:.env[.properties]

# Users live in the users table; don't create the default in-memory "user" with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# Flyway owns the schema; Hibernate only checks at startup that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Release the DB connection when the service call returns instead of holding it until the response is written.
spring.jpa.open-in-view=false
